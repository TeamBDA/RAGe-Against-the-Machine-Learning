name: GitHub Notifier for Teams

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitHub Notifier for Teams
        uses: pablovelascoedisa/github-notifications-teams-action@848ce862f236fb176868594d15ca734032f2ac3e
        with:
          teamsSecret: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "New issue updated in repository"
          body: "A new issue was updated in the repository."
          show_git_footer: "true"
          show_git_status: "true"
